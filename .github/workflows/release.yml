name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (defaults to v<version> from package.json)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.28.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: rustfmt, clippy
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Test frontend, check types, and build installer UI
        run: |
          pnpm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm build:installer-ui
      - name: Check Rust formatting
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo fmt --manifest-path installer/src-tauri/Cargo.toml --check
      - name: Test Rust logic
        run: pnpm test:rust
      - name: Check Rust warnings
        run: pnpm lint:rust
      - name: Build RustPad binary
        run: pnpm tauri build --no-bundle
      - name: Build custom Windows setup executable
        shell: pwsh
        env:
          RUSTPAD_REQUIRE_PAYLOAD: "1"
        run: |
          $payload = Join-Path $PWD "src-tauri\target\release\rustpad.exe"
          if (-not (Test-Path $payload)) { throw "Missing payload: $payload" }
          $env:RUSTPAD_PAYLOAD_BIN = $payload
          cargo build --release --locked --features custom-protocol --manifest-path installer/src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = node -p "require('./package.json').version"
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          Copy-Item installer/src-tauri/target/release/rustpad-setup.exe "release-assets/RustPad_${version}_x64-setup.exe"
      - name: Upload Windows release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-windows
          path: release-assets/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  build-macos:
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.28.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
          components: rustfmt, clippy
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Test frontend, check types, and build installer UI
        run: pnpm test && pnpm check && pnpm build:installer-ui
      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check && cargo fmt --manifest-path installer/src-tauri/Cargo.toml --check
      - name: Test macOS filesystem behavior
        run: pnpm test:rust
      - name: Check Rust warnings
        run: pnpm lint:rust
      - name: Build universal macOS app and DMG
        run: pnpm tauri build --target universal-apple-darwin --bundles app,dmg
      - name: Stage macOS release assets
        run: |
          mkdir -p release-assets
          cp src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg release-assets/
          ditto -c -k --sequesterRsrc --keepParent \
            src-tauri/target/universal-apple-darwin/release/bundle/macos/RustPad.app \
            release-assets/RustPad-macOS-universal.app.zip
      - name: Upload macOS release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-macos
          path: release-assets/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  publish:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: dist-release
          merge-multiple: true
      - name: Generate SHA256 checksums
        run: |
          cd dist-release
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
          elif [ -n "${INPUT_TAG}" ]; then
            TAG="${INPUT_TAG}"
          else
            TAG="v$(node -p "require('./package.json').version")"
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist-release/* --clobber
          else
            gh release create "$TAG" dist-release/* \
              --target "${GITHUB_SHA}" \
              --title "RustPad ${TAG}" \
              --generate-notes
          fi
