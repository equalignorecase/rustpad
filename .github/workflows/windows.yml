name: Windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.28.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: rustfmt, clippy
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Test frontend, check types, and build installer UI
        run: |
          pnpm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm build:installer-ui
      - name: Check Rust formatting
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo fmt --manifest-path installer/src-tauri/Cargo.toml --check
      - name: Test Rust logic
        run: pnpm test:rust
      - name: Check Rust warnings
        run: pnpm lint:rust
      - name: Build RustPad binary
        run: pnpm tauri build --no-bundle
      - name: Build custom Windows setup executable
        shell: pwsh
        env:
          RUSTPAD_REQUIRE_PAYLOAD: "1"
          WINDOWS_SIGN_CERT_BASE64: ${{ secrets.WINDOWS_SIGN_CERT_BASE64 }}
          WINDOWS_SIGN_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGN_CERT_PASSWORD }}
        run: |
          $payload = Join-Path $PWD "src-tauri\target\release\rustpad.exe"
          if (-not (Test-Path $payload)) { throw "Missing payload: $payload" }
          & .\scripts\sign-windows.ps1 -FilePath $payload
          $env:RUSTPAD_PAYLOAD_BIN = $payload
          cargo build --release --locked --features custom-protocol --manifest-path installer/src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = node -p "require('./package.json').version"
          New-Item -ItemType Directory -Force -Path dist-windows | Out-Null
          $outExe = "dist-windows/RustPad_${version}_x64-setup.exe"
          Copy-Item installer/src-tauri/target/release/rustpad-setup.exe $outExe
          & .\scripts\sign-windows.ps1 -FilePath $outExe
          $hash = (Get-FileHash $outExe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  RustPad_${version}_x64-setup.exe" | Set-Content -Encoding ascii dist-windows/SHA256SUMS.txt
      - name: Upload Windows installers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: RustPad-windows-x64
          path: |
            dist-windows/*.exe
            dist-windows/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
