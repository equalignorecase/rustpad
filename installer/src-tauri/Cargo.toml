[package]
name = "rustpad-setup"
version = "0.1.0"
description = "Custom setup and uninstaller for RustPad"
authors = ["RustPad Contributors"]
edition = "2024"

[build-dependencies]
flate2 = "1.1"
sha2 = "0.10"
tauri-build = { version = "2", features = [] }

[dependencies]
flate2 = "1.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
